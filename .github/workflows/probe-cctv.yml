name: Probe CCTV sources

# ตรวจกราฟระดับน้ำ ThaiWater และหน้ากล้องระดับน้ำที่ผู้ใช้ส่งมา (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: ThaiWater waterlevel_graph
        run: |
          B=https://api-v3.thaiwater.net/api/v1/thaiwater30
          curl -sS -m 60 -o wl.json "$B/public/waterlevel_load"
          jq -c '[.waterlevel_data.data[] | select(.geocode.province_code == "10" or .geocode.province_code == "12")][0:3][] | {id: .station.id, name: .station.tele_station_name.th, lat: .station.tele_station_lat, lng: .station.tele_station_long, bank: .station.min_bank, ground: .station.ground_level, msl: .waterlevel_msl, prev: .waterlevel_msl_previous}' wl.json
          echo "-- names containing มหาสวัสดิ์ / นนทบุรี / ปากเกร็ด"
          jq -c '.waterlevel_data.data[] | select(.station.tele_station_name.th | test("มหาสวัสดิ|นนทบุรี|ปากเกร็ด")) | {id: .station.id, name: .station.tele_station_name.th, lat: .station.tele_station_lat, lng: .station.tele_station_long}' wl.json
          id=$(jq -r '[.waterlevel_data.data[] | select(.geocode.province_code == "10")][0].station.id' wl.json)
          end=$(date -u +%Y-%m-%d); start=$(date -u -d '-1 day' +%Y-%m-%d)
          for q in "station_type=tele_waterlevel&station_id=$id&start_date=$start&end_date=$end" "station_id=$id"; do
            curl -sS -m 30 -H "Origin: https://dataanalytic.precare.workers.dev" -D h.txt -o g.json -w "[$q] HTTP %{http_code} size=%{size_download}\n" "$B/public/waterlevel_graph?$q"
            grep -i '^access-control-allow-origin' h.txt | tr -d '\r'
            jq -c '{result, keys: (.data | if type=="object" then keys else type end)}' g.json 2>/dev/null
            jq -c '.data | if type=="object" then (to_entries | map({k: .key, v: (.value | if type=="array" then {len: length, first: .[0], last: .[-1]} else . end)})) else . end' g.json 2>/dev/null | head -c 2500; echo
          done

      - name: Water camera pages
        run: |
          for u in "https://cctv-nont.firsttech.co.th/" "http://www.thaiclouderp.com/video/pakkret_water_report.html" "https://www.thaiclouderp.com/video/pakkret_water_report.html"; do
            echo "===== $u"
            curl -sS -L -m 20 -A "$UA" -D h.txt -o p.html -w "HTTP %{http_code} final=%{url_effective} type=%{content_type} size=%{size_download}\n" "$u" || { echo fail; continue; }
            grep -iE '^(x-frame-options|content-security-policy|access-control)' h.txt | tr -d '\r'
            grep -oiE '<title>[^<]*</title>' p.html | head -1
            echo "-- media/src:"; grep -oiE '(src|href|data-src|url)\s*[=:(]\s*["'"'"']?[^"'"'"' )>]*(m3u8|mjpe?g|jpe?g|png|mp4|rtsp|stream|video|cam|cgi|php|snapshot|hls|iframe|live)[^"'"'"' )>]*' p.html | sort -u | head -40
            echo "-- iframes:"; grep -oiE '<iframe[^>]*>' p.html | head -10
            echo "-- text:"; sed -e 's/<[^>]*>/ /g' p.html | tr -s ' \n' ' ' | head -c 600; echo
          done
