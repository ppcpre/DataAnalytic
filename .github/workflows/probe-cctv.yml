name: Probe CCTV sources

# สำรวจแหล่งรายชื่อกล้อง CCTV ที่มีพิกัด/ลิงก์รายตัว (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Longdo camera.json
        run: |
          curl -sS -L -m 30 -A "$UA" -o cam.json https://traffic.longdo.com/camera.json
          jq -c '{n: (.item | length), keys: (.item[0] | keys), first: .item[0], second: .item[1]}' cam.json
          echo "-- all keys with sample values:"
          jq -c '[.item[] | to_entries[] | {k: .key, t: (.value | type)}] | unique' cam.json
          echo "-- in BKK bbox:"
          jq -c '[.item[] | select(((.latitude // .lat) | tonumber? // 0) as $a | ((.longitude // .lon // .lng) | tonumber? // 0) as $o | $a > 13.4 and $a < 14.3 and $o > 99.8 and $o < 100.95)] | length' cam.json
          echo "-- camid prefixes:"; jq -r '.item[].camid | tostring | sub("[0-9]+$"; "")' cam.json | sort | uniq -c | sort -rn | head -20
          echo "-- samples with empty hls_url:"; jq '[.item[] | select((.hls_url // "") == "")] | length' cam.json

      - name: Longdo camera deep links
        run: |
          curl -sS -L -m 30 -A "$UA" -o s.js "https://traffic.longdo.com/sites/all/modules/traffic_camera/script.js?v=92"
          sed -n '245,275p;590,625p;1010,1035p' s.js
          echo "-- terms pages:"
          for u in https://traffic.longdo.com/terms https://map.longdo.com/terms https://www.longdo.com/terms https://traffic.longdo.com/api; do
            curl -sS -L -m 20 -A "$UA" -o t.html -w "$u HTTP %{http_code} final=%{url_effective}\n" "$u" || true
            grep -oiE '<title>[^<]*</title>' t.html | head -1
          done
