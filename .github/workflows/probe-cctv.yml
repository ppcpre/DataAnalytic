name: Probe CCTV sources

# ตรวจกล้องจังหวัดใหม่และกล้องกรมทรัพยากรน้ำบนเว็บจริง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Live API
        run: |
          for i in $(seq 1 30); do
            curl -sS -m 90 -o c.json "$APP/api/cameras?ts=$(date +%s)" || true
            n=$(python3 -c "import json; d=json.load(open('c.json'))['data']; print(sum(c['id'].startswith('dwr-') for c in d))" 2>/dev/null || echo 0)
            echo "try $i: dwr=$n"; [ "$n" -gt 0 ] && break; sleep 20
          done
          python3 - <<'PY'
          import json, collections
          d = json.load(open('c.json'))['data']
          print('total', len(d))
          print('by province', collections.Counter(c['location'].get('provinceName') or c['location']['province'] for c in d).most_common())
          print('longdo by province', collections.Counter(c['location']['province'] for c in d if c['id'].startswith('longdo-')).most_common())
          for c in d:
              if c['id'].startswith('dwr-'):
                  r = (c.get('readings') or [{}])[0]
                  print(' ', c['id'], c['name'], c['location']['provinceName'], r.get('value'), r.get('warning'), r.get('danger'), c.get('observedAt'))
          PY
          curl -sS -m 60 -o i.bin -w "dwr image %{http_code} %{content_type} %{size_download}\n" "$APP/api/dwr/image?code=TA100220"
      - name: Chrome
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          for (const id of ['dwr-TA100222', 'dwr-TA100220', 'longdo-ITICM_BMAMI0272']) {
            const p = await b.newPage({ viewport: { width: 390, height: 844 } });
            await p.goto(`${process.env.APP}/?cam=${id}`, { waitUntil: 'domcontentloaded' });
            try { await p.waitForSelector('#sheet [data-cam-view]', { timeout: 60000 }); } catch { console.log('SHEET', id, 'no sheet'); await p.close(); continue; }
            await p.waitForTimeout(15000);
            console.log('SHEET', id, JSON.stringify(await p.evaluate(() => {
              const s = document.getElementById('sheet');
              const img = s.querySelector('.cam-media img');
              return { title: s.querySelector('.sheet-title')?.textContent, sub: s.querySelector('.sheet-sub, .sheet-head small')?.textContent, mode: s.querySelector('.cam-view')?.dataset.mode, label: s.querySelector('[data-cam-label]')?.textContent, img: img ? [img.naturalWidth, img.src.slice(0, 70)] : null, tiles: [...s.querySelectorAll('.tile')].map((e) => e.textContent.replace(/\s+/g, ' ')) };
            })));
            await p.close();
          }
          await b.close();
          JS
          node t.mjs
