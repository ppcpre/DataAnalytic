name: Probe CCTV sources

# ตรวจสถานะกล้องจราจร กทม. บนเว็บที่ deploy แล้ว (ดูสาเหตุ) (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: BMA status on the live API
        run: |
          for i in $(seq 1 12); do
            out=$(curl -sS -m 90 "$APP/api/bma/status" || true)
            echo "try $i: $out"
            echo "$out" | grep -q '"cameras"' && break
            sleep 15
          done
          curl -sS -m 30 -o /dev/null -w "image proxy %{http_code}\n" "$APP/api/bma/image?id=1692"
          curl -sS -m 60 "$APP/api/cameras" | python3 -c "import json,sys; d=json.load(sys.stdin)['data']; print('cameras', len(d), 'bma', sum(c['id'].startswith('bma-') for c in d))"
