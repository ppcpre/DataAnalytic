name: Probe CCTV sources

# รอบ 2: เทียบจุดวัดคลอง/ถนนของ POPNIX Flood กับสถานีที่แอปมีอยู่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Compare
        run: |
          curl -sS -m 30 -A "$UA" -o ov.json https://flood.pop.in.th/api_overview.php
          curl -sS -m 30 -A "$UA" -o rd.json https://flood.pop.in.th/api_roads.php
          curl -sS -m 60 -A "$UA" -H 'Origin: https://dataanalytic.precare.workers.dev' -o wl.json https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load
          curl -sS -m 60 -o cam.json https://dataanalytic.precare.workers.dev/api/cameras
          python3 - <<'PY'
          import json, math, collections
          ov = json.load(open('ov.json'))['stations']; rd = json.load(open('rd.json'))['roads']
          raw = json.load(open('wl.json')); wl = raw.get('waterlevel_data', raw).get('data') if isinstance(raw.get('waterlevel_data', raw), dict) else raw.get('data'); cams = json.load(open('cam.json'))['data']
          print('popnix canal', len(ov), 'roads', len(rd), '| app water', len(wl), 'cams', len(cams))
          print('canal keys', list(ov[0].keys())); print(json.dumps(ov[0], ensure_ascii=False)[:500])
          print('road levels', collections.Counter(r['level'] for r in rd))
          print('canal levels', collections.Counter(s.get('level') for s in ov), 'online', sum(1 for s in ov if s.get('online')))
          def d(a, b, c, e): return math.hypot((a - c) * 111, (b - e) * 108)
          pts = []
          for s in wl:
              st = s.get('station') or {}
              try: pts.append((float(st.get('tele_station_lat')), float(st.get('tele_station_long')), str(st.get('tele_station_name'))[:40], str((s.get('agency') or {}).get('agency_shortname'))[:40], (s.get('geocode') or {}).get('province_code')))
              except Exception: pass
          pts = [p for p in pts if p[4] == '10']
          print('thaiwater bkk stations', len(pts), collections.Counter(p[3] for p in pts).most_common(6))
          near = 0
          for s in ov:
              m = min((d(s['lat'], s['lng'], a, b), n) for a, b, n, _, _ in pts) if pts else (99, '')
              if m[0] < 0.15: near += 1
          print('canal stations within 150 m of an app water station', near)
          PY
