name: Probe CCTV sources

# สำรวจหน้ากล้องเทศบาลบางกรวย (StreamBridge) (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Page and scripts
        continue-on-error: true
        run: |
          base=https://app.streambridge.online
          curl -sS -L -m 20 -A "$UA" -D h.txt -o p.html -w "HTTP %{http_code} %{content_type} %{size_download}\n" "$base/p/bangkruai-city"
          tr -d '\r' < h.txt | grep -iE '^(x-frame-options|content-security-policy|access-control|server)'
          grep -oiE '<title>[^<]*</title>' p.html; head -c 1500 p.html; echo
          for s in $(grep -oE '(src|href)="[^"]+\.js[^"]*"' p.html | sed -E 's/^(src|href)="//;s/"$//' | head -10); do
            case "$s" in http*) u="$s";; /*) u="$base$s";; *) u="$base/$s";; esac
            echo "===== $u"; curl -sS -L -m 20 -o s.js "$u" || continue
            grep -oE '["'"'"'`][^"'"'"'`]{0,80}(api|/p/|public|m3u8|hls|snapshot|whep|webrtc|rtsp|stream|camera|cctv|supabase|firebase)[^"'"'"'`]{0,80}["'"'"'`]' s.js | sort -u | head -40
          done
      - name: Guess API
        continue-on-error: true
        run: |
          for p in api/p/bangkruai-city api/public/bangkruai-city api/pages/bangkruai-city api/portal/bangkruai-city p/bangkruai-city.json; do
            curl -sS -m 15 -A "$UA" -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $p\n" "https://app.streambridge.online/$p" || true
            head -c 300 r.bin; echo
          done
