name: Probe CCTV sources

# เปิดหน้า reportCctv ของกรมทรัพยากรน้ำใน Chrome แล้วจับคำขอ API (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Capture requests
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import { writeFileSync } from 'node:fs';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage();
          p.on('request', (r) => { if (/\/api\/|\/cctv\//.test(r.url())) console.log('REQ', r.method(), r.url(), (r.postData() ?? '').slice(0, 600)); });
          p.on('response', async (r) => {
            if (!/listPaginate/.test(r.url())) return;
            const t = await r.text().catch(() => '');
            console.log('RESP', r.status(), t.slice(0, 2500));
            writeFileSync('list.json', t);
          });
          await p.goto('https://telemetry.dwr.go.th/reportCctv', { waitUntil: 'networkidle', timeout: 60000 }).catch((e) => console.log('goto', e.message));
          await p.waitForTimeout(8000);
          await b.close();
          JS
          node t.mjs
          python3 - <<'PY'
          import json, collections
          try:
              d = json.load(open('list.json'))
          except Exception as e:
              print('no list', e); raise SystemExit
          v = d.get('value', d)
          items = v.get('content') or v.get('items') or v.get('data') or v.get('list') if isinstance(v, dict) else v
          print('keys', list(v.keys()) if isinstance(v, dict) else type(v), 'items', len(items or []))
          if items:
              print(json.dumps(items[0], ensure_ascii=False)[:1500])
              ay = [x for x in items if 'อยุธยา' in json.dumps(x, ensure_ascii=False)]
              print('ayutthaya', len(ay))
          PY
