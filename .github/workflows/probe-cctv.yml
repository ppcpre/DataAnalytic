name: Probe CCTV sources

# นับกล้อง/จุดวัดบนเว็บจริงแยกตามแหล่ง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Live camera counts
        run: |
          site=https://dataanalytic.precare.workers.dev
          curl -sS -m 60 "$site/api/cameras" -o c.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open('c.json'))['data']
          def src(c):
              i = c['id']
              if i.startswith('sb-'): return 'บางกรวย (StreamBridge)'
              if i.startswith('nont-'): return 'นนทบุรี ' + ('ถนน' if 'ถนน' in (c.get('road') or '') else 'คลอง')
              if i.startswith('pakkret'): return 'ปากเกร็ด EON'
              if i.startswith('longdo-'): return 'Longdo/iTIC'
              return 'เพิ่มเอง'
          print('total', len(d))
          for k, v in collections.Counter(src(c) for c in d).most_common(): print(' ', k, v)
          sb = [c for c in d if c['id'].startswith('sb-')]
          for c in sb: print('SB', c['name'], c['location']['lat'], c['location']['lng'], c.get('imageTakenAt'))
          open('img.txt', 'w').write(sb[0]['imageUrl'] if sb else '')
          PY
          [ -s img.txt ] && curl -sS -m 20 -o /dev/null -w "sb image: %{http_code} %{content_type} %{size_download}\n" "$(cat img.txt)?t=1"
