name: Probe CCTV sources

# หากล้องย่านปิ่นเกล้า-ราชพฤกษ์ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Cameras in the area
        continue-on-error: true
        run: |
          curl -sS -m 30 "$APP/api/cameras" -o app.json
          curl -sS -m 30 -A "$UA" https://traffic.longdo.com/camera.json -o longdo.json
          python3 - <<'PY'
          import json, collections
          box = lambda la, ln: 13.72 <= la <= 13.90 and 100.40 <= ln <= 100.50
          d = json.load(open('app.json'))['data']
          a = [c for c in d if box(c['location']['lat'], c['location']['lng'])]
          print('APP in box', len(a))
          for c in a: print(' ', c['id'], '|', c['name'], '|', c.get('road'), '| hls' if c.get('hlsUrl') or c.get('hlsSessionUrl') else '| still' if c.get('imageUrl') else '| link')
          L = json.load(open('longdo.json'))
          items = L.get('item') if isinstance(L, dict) else L
          print('LONGDO total', len(items), 'keys', sorted(items[0].keys()))
          f = []
          for c in items:
              try: la, ln = float(c.get('latitude')), float(c.get('longitude'))
              except: continue
              if box(la, ln): f.append(c)
          print('LONGDO in box', len(f), collections.Counter(c.get('organization') for c in f))
          for c in f: print(' ', json.dumps({k: c.get(k) for k in ['camid','title','organization','geocode','vdourl','imgurl','url','hls','stream']}, ensure_ascii=False)[:400])
          kw = ['ราชพฤกษ์', 'ปิ่นเกล้า', 'บรมราชชนนี', 'ตลิ่งชัน', 'บางกรวย', 'จรัญ', 'บางบำหรุ', 'สิรินธร']
          print('LONGDO by keyword')
          for c in items:
              t = c.get('title') or ''
              if any(k in t for k in kw): print(' ', c.get('camid'), t, c.get('latitude'), c.get('longitude'), c.get('organization'))
          PY
      - name: BMA traffic camera site
        continue-on-error: true
        run: |
          for u in http://www.bmatraffic.com/ https://www.bmatraffic.com/index.aspx http://www.bmatraffic.com/PlayVideo.aspx?ID=1 ; do
            curl -sS -m 20 -A "$UA" -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $u\n" "$u"; head -c 300 r.bin | tr '\n' ' '; echo
          done
          grep -oE "(ราชพฤกษ์|ปิ่นเกล้า|บรมราชชนนี)[^<\"']{0,60}" r.bin | head
