name: Probe CCTV sources

# สำรวจเว็บกล้อง/ระดับน้ำ นนทบุรี-ปากเกร็ด ที่ผู้ใช้ส่งมา (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Nonthaburi stations
        run: |
          base=http://182.52.224.70
          curl -sS -L -m 25 -A "$UA" -o n.html "$base/?page=cctv" || true
          echo "-- STATION in page:"; grep -n 'STATION' n.html | cut -c1-6000 | head -5
          echo "-- json.php?app=station:"
          curl -sS -L -m 25 -A "$UA" -D h.txt -o j.txt "$base/json.php?app=station" -w "HTTP %{http_code} type=%{content_type} size=%{size_download}\n" || true
          tr -d '\r' < h.txt | grep -iE '^(access-control|content-type)'
          head -c 8000 j.txt; echo
          echo "-- first photo urls:"
          img=$( (grep -oE 'http[^"\\]+\.(jpe?g|png|cgi)[^"\\]*' n.html j.txt; grep -oE '"cctv":\["[^"]+' j.txt | sed 's/.*\["//') | head -3)
          for u in $img; do u=$(echo "$u" | sed 's#\\/#/#g'); echo "$u"; curl -sS -m 20 -A "$UA" -o /dev/null -D - "$u" | tr -d '\r' | grep -iE '^(HTTP|content-type|content-length|access-control)'; done
          echo "-- 8081:"; curl -sS -m 15 -A "$UA" "http://182.52.224.70:8081/index.html" | head -c 1500; echo

      - name: Pak Kret pages
        run: |
          for page in "https://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred" "https://www.pakkretconnect.com/liffwater/eon"; do
            echo; echo "=================== $page"
            curl -sS -L -m 25 -A "$UA" -D h.txt -o q.html "$page" -w "HTTP %{http_code} size=%{size_download}\n" || continue
            tr -d '\r' < h.txt | grep -iE '^(x-frame-options|content-security-policy)'
            grep -oiE '<title>[^<]*</title>' q.html | head -1
            echo "-- local scripts:"; grep -oiE '<script[^>]+src="[^"]+"' q.html | grep -viE 'unpkg|jsdelivr|cdnjs|tailwind|googleapis|gstatic' | head
            echo "-- iframes/img/video:"; grep -oiE '<(iframe|img|video|source)[^>]*>' q.html | head -30
            echo "-- inline script lines of interest:"
            awk '/<script/{s=1} s{print} /<\/script>/{s=0}' q.html | grep -nE 'lat|lng|L\.marker|fetch\(|ajax|url|src|jpg|m3u8|\.php|api|name|title|\[' | cut -c1-400 | head -150
          done
