name: Probe CCTV sources

# ทดสอบภาพสด MJPEG ของกรมทรัพยากรน้ำใน Chrome (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: MJPEG in img
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage();
          p.on('response', (r) => { if (/mjpeg/.test(r.url())) console.log('RESP', r.status(), JSON.stringify(r.headers())); });
          p.on('requestfailed', (r) => { if (/mjpeg/.test(r.url())) console.log('FAIL', r.failure()?.errorText); });
          await p.goto('https://dataanalytic.precare.workers.dev/', { waitUntil: 'domcontentloaded' });
          await p.evaluate(() => {
            for (const [id, rp] of [['a', 'no-referrer'], ['b', '']]) {
              const i = document.createElement('img'); i.id = id; if (rp) i.referrerPolicy = rp;
              i.onload = () => console.log('load', id); i.onerror = () => console.log('error', id);
              i.src = 'https://telemetry.dwr.go.th/cctv/mjpeg/TA100222?x=' + id; document.body.appendChild(i);
            }
          });
          for (let t = 0; t < 6; t++) {
            await p.waitForTimeout(3000);
            console.log('t', (t + 1) * 3, JSON.stringify(await p.evaluate(() => ['a', 'b'].map((id) => document.getElementById(id).naturalWidth))));
          }
          p.on('console', (m) => console.log('console', m.text()));
          await b.close();
          JS
          node t.mjs
