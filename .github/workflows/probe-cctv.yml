name: Probe CCTV sources

# ตรวจ ThaiWater: CORS, ขนาดข้อมูล และการจำกัดความถี่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ThaiWater CORS and rate limit
        run: |
          for ep in waterlevel_load rain_24h; do
            u="https://api-v3.thaiwater.net/api/v1/thaiwater30/public/$ep"
            echo "===== $ep"
            curl -sS -m 60 -H "Origin: https://dataanalytic.precare.workers.dev" -D h.txt -o b.json -w "HTTP %{http_code} size=%{size_download} time=%{time_total}\n" "$u"
            grep -iE '^(access-control|content-encoding|content-type|retry-after|x-ratelimit|ratelimit|cache-control|server|cf-)' h.txt | tr -d '\r'
            echo "-- preflight"
            curl -sS -m 20 -X OPTIONS -H "Origin: https://dataanalytic.precare.workers.dev" -H "Access-Control-Request-Method: GET" -D - -o /dev/null "$u" | grep -iE '^(HTTP/|access-control)' | tr -d '\r'
            echo "-- gzip size"; curl -sS -m 60 --compressed -H 'Accept-Encoding: gzip' -o /dev/null -w "%{size_download}\n" "$u"
          done
          echo "-- burst 6 requests"
          for i in 1 2 3 4 5 6; do curl -sS -m 30 -o /dev/null -w "%{http_code} " "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h"; done; echo
