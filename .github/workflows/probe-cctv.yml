name: Probe CCTV sources

# สำรวจหน้ากล้องเทศบาลบางกรวย (StreamBridge) (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Public JSON
        continue-on-error: true
        run: |
          base=https://app.streambridge.online
          curl -sS -m 20 -A "$UA" -D h.txt -o j.json "$base/api/public/bangkruai-city"
          tr -d '\r' < h.txt | grep -iE '^(access-control|cache-control)'
          python3 -c "import json; print(json.dumps(json.load(open('j.json')), ensure_ascii=False, indent=1))" | head -250
      - name: Page chunk API paths
        continue-on-error: true
        run: |
          base=https://app.streambridge.online
          curl -sS -L -m 20 -A "$UA" -o p.html "$base/p/bangkruai-city"
          for s in $(grep -oE '/_next/static/chunks/[^"]+\.js' p.html | sort -u); do
            curl -sS -m 20 -o s.js "$base$s" || continue
            hits=$(grep -oE '.{0,60}(/api/|\.m3u8|whep|snapshot|thumbnail|/hls|/live|/stream)[^"'"'"'`]{0,80}' s.js | sort -u | head -30)
            [ -n "$hits" ] && { echo "===== $s"; echo "$hits"; }
          done
