name: Probe CCTV sources

# ตรวจกล้องเทศบาลนครรังสิตบนเว็บที่ deploy แล้ว (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Rangsit points on the live API
        run: |
          for i in $(seq 1 30); do
            curl -sS -m 30 "$APP/api/cameras?ts=$(date +%s)" -o c.json || true
            n=$(python3 -c "import json; d=json.load(open('c.json'))['data']; print(sum(1 for c in d if c['id'].startswith('rs-')))" 2>/dev/null || echo 0)
            echo "try $i: rs=$n"; [ "$n" -gt 0 ] && break; sleep 15
          done
          python3 - <<'PY'
          import json, collections
          d = json.load(open('c.json'))['data']
          rs = [c for c in d if c['id'].startswith('rs-')]
          print('total cameras', len(d), 'rangsit', len(rs))
          print('cams', [c['id'] for c in rs if c['id'].startswith('rs-cam-')])
          print('reports', sum(1 for c in rs if c['id'].startswith('rs-rep-')), 'with clip', sum(1 for c in rs if c.get('videoUrl')))
          print(collections.Counter(c.get('alert', {}).get('label') for c in rs))
          for c in rs[:3]: print(json.dumps(c, ensure_ascii=False))
          open('urls.txt', 'w').write('\n'.join([rs[0]['imageUrl']] + [c['imageUrl'] for c in rs if c['id'].startswith('rs-rep-')][:1]))
          PY
          while read u; do curl -sS -m 20 -o /dev/null -w "%{http_code} %{content_type} %{size_download} <- $u\n" -H "Referer: $APP/" "$u"; done < urls.txt
