name: Probe CCTV sources

# เทียบกล้อง Longdo กับที่แอปแสดง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Compare
        run: |
          curl -sS -m 30 -A "$UA" -o l.json https://traffic.longdo.com/camera.json
          curl -sS -m 60 -o a.json https://dataanalytic.precare.workers.dev/api/cameras
          python3 - <<'PY'
          import json, collections
          L = json.load(open('l.json'))['item']; A = json.load(open('a.json'))['data']
          have = {c['id'] for c in A}
          print('longdo', len(L), 'app longdo', sum(i.startswith('longdo-') for i in have))
          miss = [x for x in L if 'longdo-' + x['camid'] not in have]
          print('missing', len(miss), collections.Counter((x.get('geocode') or '')[:2] for x in miss))
          for x in L:
              if x['camid'] in ('ITICM_BMAMI0080', 'ITICM_BMAMI0081'):
                  print(json.dumps({k: x.get(k) for k in ['camid','title','geocode','latitude','longitude','hls_url','link','vdourl','imgurl']}, ensure_ascii=False))
                  print('  in app:', 'longdo-' + x['camid'] in have)
          for x in miss[:15]: print('  miss', x['camid'], x.get('geocode'), x['title'][:60], x.get('latitude'), x.get('longitude'))
          PY
