name: Probe CCTV sources

# หาแหล่งรายชื่อกล้องของแผนที่หลัก Longdo Traffic (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Longdo main camera layer
        run: |
          for f in chunk-vendors index; do
            curl -sS -L -m 30 -A "$UA" -o $f.js "https://traffic.longdo.com/main/js/$f.js"
            echo "== $f: context"
            grep -oE '.{0,160}VUE_APP_LONGDO_TRAFFIC_CAMERA_BASE_URL.{0,160}' $f.js | head -5
            grep -oE '.{0,120}(camera_refresh|layerPanel\.camera|cameraList|getCamera|camera\.json|cctv).{0,160}' $f.js | head -12
            grep -oE 'https?://[a-zA-Z0-9._/-]*(camera|cctv|traffic)[a-zA-Z0-9._/?=&-]*' $f.js | sort -u | head -20
          done
          for u in https://traffic.longdo.com/api/camera https://traffic.longdo.com/api/camera/list https://traffic.longdo.com/camera/list.json https://camera.longdo.com/ https://traffic.longdo.com/camera.json?all=1; do
            curl -sS -L -m 15 -A "$UA" -o r.out -w "$u HTTP %{http_code} type=%{content_type} size=%{size_download}\n" "$u" || true
            head -c 200 r.out; echo
          done
