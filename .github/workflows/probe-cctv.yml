name: Probe CCTV sources

# รอบ 2: อ่านหน้า "ข้อมูลเปิดและ API" ของ POPNIX Flood (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      P: https://flood.pop.in.th
    steps:
      - name: API page text
        run: |
          set +e
          curl -sS -m 30 -A "$UA" -L -o api.html "$P/api/"
          python3 - <<'PY'
          import re, html
          h = open('api.html', encoding='utf-8', errors='replace').read()
          h = re.sub(r'<(script|style)[^>]*>.*?</\1>', ' ', h, flags=re.S)
          t = html.unescape(re.sub(r'<[^>]+>', '\n', h))
          t = re.sub(r'\n\s*\n+', '\n', t)
          print(t[:9000])
          PY
          for f in dds pkk doh; do
            curl -sS -m 30 -A "$UA" -o $f.json "$P/cctv/$f.json"
            python3 -c "
          import json,collections; d=json.load(open('$f.json')); c=d['cams']
          box=[x for x in c if 13.4<=x['lat']<=14.3 and 100.1<=x['lng']<=100.95]
          print('$f', 'total', len(c), 'bkk-area', len(box), 'with img', sum(1 for x in box if x.get('img')))"
          done
