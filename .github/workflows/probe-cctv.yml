name: Probe CCTV sources

# ตรวจว่าภาพกล้องแต่ละแบบ (MJPEG / ภาพนิ่ง / HLS) ใช้ได้จริงหรือไม่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      ORIGIN: https://dataanalytic.precare.workers.dev
    steps:
      - name: Per-camera media check
        run: |
          curl -sS -m 30 -A "$UA" -o cam.json https://traffic.longdo.com/camera.json
          jq -c '.item[] | select((.geocode|tostring|.[0:2]) as $p | ["10","11","12","13","73","74"] | index($p))' cam.json > area.jsonl
          wc -l < area.jsonl
          echo "camid | jpeg_size | mjpeg_5s_bytes | hls | hls_status | acao | first_segment"
          while read -r row; do
            id=$(jq -r .camid <<<"$row"); img=$(jq -r '.imgurl // ""' <<<"$row"); link=$(jq -r '.link // ""' <<<"$row"); hls=$(jq -r '.hls_url // ""' <<<"$row")
            js=$( [ -n "$img" ] && curl -sS -m 10 -A "$UA" "$img" 2>/dev/null | wc -c || echo -)
            mj=$( [ -n "$link" ] && curl -sS -m 5 -A "$UA" "$link" 2>/dev/null | wc -c || echo -)
            hs=-; ac=-; seg=-
            if [[ "$hls" == https://* ]]; then
              hs=$(curl -sS -m 10 -A "$UA" -H "Origin: $ORIGIN" -D h.txt -o pl.m3u8 -w '%{http_code}' "$hls" 2>/dev/null || echo err)
              ac=$(grep -i '^access-control-allow-origin' h.txt | tr -d '\r' | cut -d' ' -f2- || true)
              seg=$(grep -v '^#' pl.m3u8 | head -1)
            fi
            echo "$id | $js | $mj | ${hls:0:70} | $hs | ${ac:-none} | ${seg:0:60}"
          done < area.jsonl
