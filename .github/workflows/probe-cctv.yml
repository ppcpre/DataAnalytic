name: Probe CCTV sources

# ตรวจว่ากล้องจราจร กทม. ปิดอยู่ และ /api/cameras ตอบเร็ว (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Live status
        run: |
          for i in $(seq 1 20); do
            out=$(curl -sS -m 60 "$APP/api/bma/status" || true); echo "try $i: $out"
            echo "$out" | grep -q '"mode":"off"' && break; sleep 15
          done
          for i in 1 2; do
            curl -sS -m 60 -o c.json -w "cameras %{http_code} in %{time_total}s\n" "$APP/api/cameras?nocache=$(date +%s%N)"
          done
          python3 -c "import json; d=json.load(open('c.json'))['data']; print('cameras', len(d))"
