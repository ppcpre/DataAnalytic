name: Probe CCTV sources

# ตรวจแหล่งกล้องใหม่ + ข้อมูลประวัติบนเว็บจริง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: History on live site
        continue-on-error: true
        run: |
          site=https://dataanalytic.precare.workers.dev
          curl -sS -m 60 -o /dev/null "$site/api/cameras"
          curl -sS -m 30 "$site/api/history/stats"; echo
          curl -sS -m 30 "$site/api/history/nont-STN2:down?hours=24" | head -c 400; echo
      - name: New camera sources
        continue-on-error: true
        timeout-minutes: 5
        run: |
          for u in https://cdp.rangsitcity.go.th/ https://nkndatamap.nakornnont.go.th/public https://world.tehx.dyndns.info/flood https://floodbangkok.bangkok.go.th/ https://live.iticfoundation.org/; do
            echo; echo "=================== $u"
            curl -sS -L -m 20 -A "$UA" -D h.txt -o p.html -w "HTTP %{http_code} final=%{url_effective} type=%{content_type} size=%{size_download}\n" "$u" 2>&1 | tail -1
            tr -d '\r' < h.txt | grep -iE '^(x-frame-options|content-security-policy|access-control|server)' | cut -c1-200
            grep -oiE '<title>[^<]*</title>' p.html | head -1
            echo "-- scripts:"; grep -oiE '<script[^>]+src="[^"]+"' p.html | sed -E 's/.*src="([^"]+)"/\1/' | head -12
            echo "-- hints:"; grep -oiE '["'"'"'(=][^"'"'"' ()<>]{0,80}(api|json|m3u8|hls|snapshot|cctv|camera|stream|lat|lng)[^"'"'"' ()<>]{0,60}' p.html | sort -u | head -30
            echo "-- iframes:"; grep -oiE '<iframe[^>]*>' p.html | head -5
            echo "-- text:"; sed -e 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' p.html | tr -s ' \n\t' ' ' | head -c 600; echo
          done
