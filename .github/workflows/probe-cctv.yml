name: Probe CCTV sources

# ตรวจภาพสดกล้องกรมทรัพยากรน้ำบนเว็บจริง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Wait for deploy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS -m 10 -o /dev/null -w "%{http_code}" "$APP/api/dwr/live?code=x" || true)
            echo "try $i: $code"; [ "$code" = "400" ] && break; sleep 15
          done
          curl -sS -m 8 -D h.txt -o m.bin "$APP/api/dwr/live?code=TA100222" || true
          tr -d '\r' < h.txt | grep -iE '^(HTTP|content-type|cross-origin)'; ls -l m.bin
      - name: Chrome
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          for (const id of ['dwr-TA100222', 'dwr-TA100220', 'dwr-TC100222']) {
            const p = await b.newPage({ viewport: { width: 390, height: 844 } });
            await p.goto(`${process.env.APP}/?cam=${id}`, { waitUntil: 'domcontentloaded' });
            try { await p.waitForSelector('#sheet [data-cam-view]', { timeout: 60000 }); } catch { console.log('SHEET', id, 'no sheet'); await p.close(); continue; }
            await p.waitForTimeout(15000);
            console.log('SHEET', id, JSON.stringify(await p.evaluate(() => {
              const s = document.getElementById('sheet');
              const img = s.querySelector('.cam-media img');
              return { title: s.querySelector('.sheet-title')?.textContent, mode: s.querySelector('.cam-view')?.dataset.mode, label: s.querySelector('[data-cam-label]')?.textContent, img: img ? [img.naturalWidth, img.src.slice(0, 70)] : null, tiles: [...s.querySelectorAll('.tile')].map((e) => e.textContent.replace(/\s+/g, ' ')) };
            })));
            await p.close();
          }
          await b.close();
          JS
          node t.mjs
