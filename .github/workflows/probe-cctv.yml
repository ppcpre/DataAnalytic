name: Probe CCTV sources

# สำรวจแหล่งข้อมูลภาพเรดาร์ฝน (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      ORIGIN: 'https://dataanalytic.precare.workers.dev'
    steps:
      - name: radar_img
        run: |
          curl -sS -m 30 -H "Origin: $ORIGIN" -D h.txt -o r.json -w "%{http_code} %{content_type} %{size_download}\n" "https://api-v3.thaiwater.net/api/v1/thaiwater30/analyst/radar_img"
          tr -d '\r' < h.txt | grep -iE 'access-control|cache-control'
          python3 - <<'PY'
          import json
          d = json.load(open('r.json'))
          print(type(d).__name__, list(d.keys()) if isinstance(d, dict) else '')
          rows = d.get('data') if isinstance(d, dict) else d
          if isinstance(rows, dict): print('data keys', list(rows.keys())[:20]); rows = next((v for v in rows.values() if isinstance(v, list)), [])
          print('rows', len(rows))
          for r in rows:
              s = json.dumps(r, ensure_ascii=False)
              if any(k in s for k in ('njk', 'nkm', 'svp', 'หนองจอก', 'หนองแขม', 'สุวรรณภูมิ')): print(s[:700])
          if rows: print('FIRST', json.dumps(rows[0], ensure_ascii=False)[:700])
          PY
          mp=$(python3 -c "import json; print(next(x['media_path_thumb'] for x in json.load(open('r.json'))['data'] if x['radar_type']=='njk'))")
          curl -sS -m 20 -o i.bin -w "image without Origin: %{http_code} %{content_type} %{size_download}\n" "https://api-v3.thaiwater.net/api/v1/thaiwater30/shared/image?image=$mp"
