name: Probe CCTV sources

# สำรวจรายชื่อกล้อง CCTV ของ ThaiWater (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: ThaiWater analyst/cctv
        run: |
          curl -sS -m 30 -A "$UA" -o c.json https://api-v3.thaiwater.net/api/v1/thaiwater30/analyst/cctv
          jq -c '{n: (.data | length), keys: ([.data[] | keys] | add | unique)}' c.json
          echo "-- in BKK bbox (13.4-14.3, 99.8-100.95):"
          jq -c '[.data[] | select((.lat|tonumber? // 0) > 13.4 and (.lat|tonumber? // 0) < 14.3 and (.long|tonumber? // 0) > 99.8 and (.long|tonumber? // 0) < 100.95)] | length' c.json
          jq -c '.data[] | select((.lat|tonumber? // 0) > 13.4 and (.lat|tonumber? // 0) < 14.3 and (.long|tonumber? // 0) > 99.8 and (.long|tonumber? // 0) < 100.95)' c.json | head -c 6000; echo
          echo "-- url schemes / hosts (all):"
          jq -r '.data[] | [(.cctv_url // "" | tostring | capture("^(?<s>[a-z]+)://(?<h>[^/]+)")? | "\(.s)://\(.h)") // "none", ((.cctv_flash // "") | tostring | length > 0 | tostring)] | @tsv' c.json | sort | uniq -c | sort -rn | head -20
          echo "-- media types:"; jq -r '.data[] | (.media_type // .cctv_type // .type // "?") | tostring' c.json | sort | uniq -c | head

      - name: Sample image headers (BKK area)
        run: |
          for u in $(jq -r '.data[] | select((.lat|tonumber? // 0) > 13.4 and (.lat|tonumber? // 0) < 14.3 and (.long|tonumber? // 0) > 99.8 and (.long|tonumber? // 0) < 100.95) | .cctv_url // empty' c.json | head -6); do
            echo "===== $u"
            curl -sS -L -m 15 -A "$UA" -D - -o b.out "$u" | grep -iE '^(HTTP/|content-type|x-frame-options|content-security-policy)' || true
            echo "size=$(wc -c < b.out)"
          done
