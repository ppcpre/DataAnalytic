name: Probe CCTV sources

# สำรวจระบบกล้อง bmatraffic.com (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      B: http://www.bmatraffic.com
    steps:
      - name: Camera list and session flow
        continue-on-error: true
        run: |
          curl -sS -m 30 -A "$UA" -c jar.txt -o p.html "$B/"
          python3 - <<'PY'
          import re, collections
          h = open('p.html', encoding='utf-8', errors='replace').read()
          cams = re.findall(r'preview_id:\s*"(\d+)",\s*sub_name:\s*"([^"]*)"', h)
          print('cameras', len(cams))
          kw = ['ราชพฤกษ์', 'ปิ่นเกล้า', 'บรมราชชนนี', 'ตลิ่งชัน', 'สิรินธร', 'จรัญ', 'บางกรวย', 'บางพลัด', 'อรุณอมรินทร์', 'พุทธมณฑล', 'กัลปพฤกษ์', 'บางขุนนนท์', 'ฉิมพลี', 'แก้วเงินทอง', 'บางระมาด', 'สวนผัก', 'กาญจนาภิเษก']
          for i, n in cams:
              if any(k in n for k in kw): print(' ', i, n.replace('\t', ' '))
          # หา structure อื่นที่มีพิกัด
          for k in [r'\b1[34]\.\d{4,}', r'100\.\d{4,}', 'Marker', 'google.maps', 'ShowCCTV', 'PlayVideo', 'preview_id']:
              idx = [m.start() for m in re.finditer(k, h)]
              print('==', k, len(idx))
              for i in idx[:2]: print('   ', h[max(0, i-200):i+200].replace('\n', ' '))
          # ฟังก์ชันที่เปิดกล้องเมื่อคลิก
          for m in re.finditer(r'function\s+\w*[Pp]review\w*\s*\([^)]*\)\s*\{', h):
              print('FUNC', h[m.start():m.start()+600].replace('\n', ' '))
          PY
          for p in "PlayVideo.aspx?ID=1692" "show.aspx?image=1692"; do
            sleep 8
            curl -sS -m 20 -A "$UA" -b jar.txt -c jar.txt -e "$B/" -D h.txt -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $p\n" "$B/$p" || true
            tr -d '\r' < h.txt | grep -iE '^(HTTP|content-type|set-cookie|location)'; file r.bin | cut -c1-120; head -c 600 r.bin | tr '\n\r' '  '; echo
          done
          sleep 8; curl -sS -m 20 -A "$UA" -o /dev/null -w "%{http_code} again home\n" "$B/" || true
