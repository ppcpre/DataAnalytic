name: Probe CCTV sources

# สำรวจเว็บกล้อง/ระดับน้ำ นนทบุรี-ปากเกร็ด ที่ผู้ใช้ส่งมา (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Pak Kret EON sensors
        continue-on-error: true
        timeout-minutes: 2
        run: |
          curl -sS -L -m 30 -A "$UA" -o e.html "https://www.pakkretconnect.com/liffwater/eon" || true
          python3 - <<'PY'
          import json, re, subprocess
          h = open('e.html', encoding='utf-8', errors='replace').read()
          m = re.search(r'const sensorData = (\[.*?\]);', h, re.S)
          d = json.loads(m.group(1))
          print('count', len(d), 'keys', list(d[0].keys()))
          for s in d:
              print(json.dumps({k: v for k, v in s.items() if k != 'snapshot'}, ensure_ascii=False)[:400])
              print('  snapshot', s.get('snapshot'))
          for s in d[:2]:
              u = s['snapshot'].replace(' ', '%20')
              r = subprocess.run(['curl','-sS','-m','15','-o','/dev/null','-w','%{http_code} %{content_type} %{size_download}',u],capture_output=True,text=True)
              print('SNAP', r.stdout, r.stderr[:120])
          for m2 in re.finditer(r'<img[^>]+snapshot[^>]*>', h): print('IMGTAG', m2.group(0)[:200])
          i = h.find('thresholds'); print('THRESH', h[i:i+800])
          PY
          curl -sS -m 15 -o /dev/null -w "local snapshot %{http_code} %{content_type} %{size_download}\n" "https://www.pakkretconnect.com/snapshots/192.168.21.66/192.168.21.66.jpg" || true

      - name: Pak Kret traffic CCTV
        continue-on-error: true
        timeout-minutes: 2
        run: |
          for u in "https://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred" "http://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred" "http://www.thaiclouderp.com/video/pakkret_water_report.html"; do
            echo "== $u"; curl -sS -L -m 20 -A "$UA" -o t.html -w "HTTP %{http_code} size=%{size_download}\n" "$u" 2>&1 | head -3
            [ -s t.html ] && { grep -oiE '<(iframe|img|video|source)[^>]*>' t.html | head -20; awk '/<script/{s=1} s{print} /<\/script>/{s=0}' t.html | grep -nE 'lat|lng|m3u8|jpg|url|src|api|\.php' | cut -c1-300 | head -40; }
            rm -f t.html
          done
