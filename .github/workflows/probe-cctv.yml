name: Probe CCTV sources

# สำรวจเว็บกล้อง/ระดับน้ำ นนทบุรี-ปากเกร็ด ที่ผู้ใช้ส่งมา (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Pages
        run: |
          show() {
            u="$1"; echo; echo "=================== $u"
            curl -sS -L -m 25 -A "$UA" -D h.txt -o p.html -w "HTTP %{http_code} final=%{url_effective} type=%{content_type} size=%{size_download}\n" "$u" || { echo FAIL; return; }
            grep -iE '^(x-frame-options|content-security-policy|access-control-allow-origin|server)' h.txt | tr -d '\r'
            grep -oiE '<title>[^<]*</title>' p.html | head -1
            echo "-- scripts:"; grep -oiE '<script[^>]+src="[^"]+"' p.html | sed -E 's/.*src="([^"]+)"/\1/' | head -15
            echo "-- media/api hints:"; grep -oiE '["'"'"'(=]\s*[^"'"'"' ()<>]*(m3u8|mjpe?g|\.jpe?g|\.png|snapshot|cgi|api|json|php|stream|rtsp|cctv|camera|lat|lng)[^"'"'"' ()<>]*' p.html | sort -u | head -50
            echo "-- iframes:"; grep -oiE '<iframe[^>]*>' p.html | head -10
            echo "-- text:"; sed -e 's/<script[^>]*>.*<\/script>//g; s/<[^>]*>/ /g' p.html | tr -s ' \n\t' ' ' | head -c 1200; echo
          }
          show "https://www.pakkretconnect.com/liffwater/eon"
          show "https://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred"
          show "http://182.52.224.70/?page=cctv"
          show "http://182.52.224.70/?page=cctv&view=milestone"

      - name: Scripts of Nonthaburi CCTV app
        run: |
          base=http://182.52.224.70
          curl -sS -L -m 25 -A "$UA" -o n.html "$base/?page=cctv" || exit 0
          for s in $(grep -oiE '<script[^>]+src="[^"]+"' n.html | sed -E 's/.*src="([^"]+)"/\1/' | grep -v jquery | grep -v bootstrap | grep -v angular.min); do
            case "$s" in http*) u="$s";; ./*) u="$base/${s#./}";; /*) u="$base$s";; *) u="$base/$s";; esac
            echo "===== $u"
            curl -sS -L -m 25 -A "$UA" -o s.js "$u" || continue
            grep -oiE '["'"'"'][^"'"'"']*(api|json|php|cctv|camera|snapshot|image|jpg|lat|lng|\?page=|ajax|get)[^"'"'"']*["'"'"']' s.js | sort -u | head -60
          done
          echo "-- inline scripts in page:"
          sed -n '/<script>/,/<\/script>/p' n.html | head -120

      - name: Scripts of Pak Kret pages
        run: |
          for page in "https://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred" "https://www.pakkretconnect.com/liffwater/eon"; do
            curl -sS -L -m 25 -A "$UA" -o q.html "$page" || continue
            base=$(echo "$page" | sed -E 's#(https?://[^/]+).*#\1#')
            dir=$(echo "$page" | sed -E 's#/[^/]*$##')
            for s in $(grep -oiE '<script[^>]+src="[^"]+"' q.html | sed -E 's/.*src="([^"]+)"/\1/' | grep -viE 'jquery|bootstrap|gtag|googletag|facebook|liff' | head -8); do
              case "$s" in http*) u="$s";; //*) u="https:$s";; /*) u="$base$s";; *) u="$dir/$s";; esac
              echo "===== $u"
              curl -sS -L -m 25 -A "$UA" -o s.js "$u" || continue
              grep -oiE '["'"'"'`][^"'"'"'`]*(api|json|php|cctv|camera|snapshot|m3u8|jpg|stream|lat|lng|firebase|supabase)[^"'"'"'`]*["'"'"'`]' s.js | sort -u | head -50
            done
            echo "-- inline script of $page:"; sed -n '/<script>/,/<\/script>/p;/<script type/,/<\/script>/p' q.html | head -80
          done
