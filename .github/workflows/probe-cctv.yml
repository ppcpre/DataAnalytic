name: Probe CCTV sources

# รอบ 2: ดูว่าเว็บรวมกล้อง (POPNIX Flood, cctv.maholan.net) ดึงข้อมูลจากที่ไหน (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Capture requests in Chrome
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          // หา URL ของ POPNIX Flood จากบทความข่าว
          const a = await b.newPage();
          await a.goto('https://www.kaohoon.com/news/general/868635', { waitUntil: 'domcontentloaded', timeout: 60000 }).catch((e) => console.log('kaohoon', e.message));
          const links = await a.evaluate(() => [...document.querySelectorAll('a')].map((x) => x.href).filter((h) => /popnix|flood/i.test(h)));
          console.log('POPNIX links', JSON.stringify([...new Set(links)].slice(0, 15)));
          await a.close();
          for (const url of ['https://cctv.maholan.net/', ...new Set(links.filter((h) => /popnix/i.test(h) && !/kaohoon/.test(h)))].slice(0, 3)) {
            const p = await b.newPage();
            const seen = new Map();
            p.on('response', async (r) => {
              const u = r.url();
              const t = r.headers()['content-type'] ?? '';
              if (/json|javascript-json|text\/plain/.test(t) || /\/api\/|\.json/.test(u)) {
                if (seen.has(u)) return;
                const body = await r.text().catch(() => '');
                seen.set(u, body.length);
                console.log('RESP', r.status(), t.slice(0, 30), body.length, u.slice(0, 150), '|', body.slice(0, 250).replace(/\s+/g, ' '));
              }
            });
            p.on('request', (r) => { if (/m3u8|mjpe?g|jpg|jpeg|snapshot|image/i.test(r.url()) && !/\.(png|svg|ico)$/.test(r.url())) console.log('MEDIA', r.url().slice(0, 150)); });
            console.log('=== OPEN', url);
            await p.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch((e) => console.log('goto', e.message));
            await p.waitForTimeout(8000);
            console.log('TITLE', await p.title());
            await p.close();
          }
          await b.close();
          JS
          node t.mjs 2>&1 | head -150
