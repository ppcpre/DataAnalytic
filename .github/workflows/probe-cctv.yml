name: Probe CCTV sources

# หา API รายชื่อสถานีกล้องของกรมทรัพยากรน้ำ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      T: https://telemetry.dwr.go.th
    steps:
      - name: API base in chunks
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -o p.html "$T/reportCctv"
          for s in $(grep -oE '/_next/static/chunks/[^"]+\.js' p.html | sort -u); do
            curl -sS -m 20 -A "$UA" -o c.js "$T$s" || continue
            hits=$(grep -oE '.{0,120}(\$8=|\$8:|x6=|x6:|baseURL|apiBase|API_BASE|NEXT_PUBLIC_API|"/api"|/api/v1|\.dwr\.go\.th)[^;]{0,160}' c.js | sort -u | head -6)
            [ -n "$hits" ] && { echo "== $s"; echo "$hits"; }
          done
      - name: Candidate endpoints
        continue-on-error: true
        run: |
          for p in api/public/reportCctv api/public/reportCctv/search api/public/reportCctv/list api/public/reportCctv/summary api/public/reportCctv/page api/public/reportCctv/find api/v1/public/reportCctv/search public/reportCctv/search; do
            curl -sS -m 20 -A "$UA" -X POST -H 'content-type: application/json' -d '{}' -o r.bin -w "POST %{http_code} %{content_type} %{size_download} <- $p\n" "$T/$p"; head -c 400 r.bin | tr '\n' ' '; echo
          done
          curl -sS -m 15 -A "$UA" -o r.bin -w "GET mjpeg %{http_code} %{content_type} %{size_download}\n" --max-time 8 "$T/cctv/mjpeg/AA000000" || true
