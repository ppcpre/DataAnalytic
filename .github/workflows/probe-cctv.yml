name: Probe CCTV sources

# หาวิธีเล่นภาพสดของ StreamBridge (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Player code
        continue-on-error: true
        run: |
          base=https://app.streambridge.online
          curl -sS -m 20 -A "$UA" -o p.html "$base/p/bangkruai-city"
          s=$(grep -oE '/_next/static/chunks/app/p/[^"]+\.js' p.html | head -1)
          curl -sS -m 20 -o pg.js "$base$s"; wc -c pg.js
          echo "--- fetch/concat calls"; grep -oE '.{0,40}fetch\([^)]{0,200}\)' pg.js | head -20
          grep -oE '.{0,30}concat\(j,"[^"]+"\).{0,120}' pg.js | head -20
          echo "--- strings with /"; grep -oE '"/[a-zA-Z0-9_/.-]{3,60}"' pg.js | sort -u | head -60
          echo "--- media hints"; grep -oiE '.{0,100}(hls|m3u8|whep|webrtc|RTCPeer|mse|websocket|wss:|ws:|flv|mpegts|jsmpeg|token).{0,100}' pg.js | head -30
          # chunks loaded by webpack runtime
          w=$(grep -oE '/_next/static/chunks/webpack-[^"]+\.js' p.html | head -1); curl -sS -m 20 -o w.js "$base$w"
          echo "--- other chunks with media"
          for c in $(grep -oE '/_next/static/chunks/[^"]+\.js' p.html | sort -u); do
            curl -sS -m 20 -o c.js "$base$c" || continue
            n=$(grep -ciE 'm3u8|whep|RTCPeerConnection|hls\.js|Hls\.' c.js || true)
            [ "$n" != "0" ] && { echo "== $c ($n)"; grep -oiE '.{0,100}(m3u8|whep|RTCPeerConnection|loadSource|/api/[a-z]).{0,120}' c.js | head -15; }
          done
