name: Probe CCTV sources

# ตรวจว่าหน้าดูกล้องฝังใน iframe ได้หรือไม่ (X-Frame-Options / CSP frame-ancestors) — รันเองจากแท็บ Actions
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Frame headers
        run: |
          curl -sS -L -m 30 -A "$UA" -o cam.json https://traffic.longdo.com/camera.json
          bma=$(jq -r '[.item[] | select(.camid | startswith("ITICM_BMAMI"))][0] | .link' cam.json)
          doh=$(jq -r '[.item[] | select(.camid | startswith("DOH"))][0] | .link' cam.json)
          img=$(jq -r '[.item[] | select(.camid | startswith("ITICM_BMAMI"))][0] | .imgurl' cam.json)
          for u in "https://traffic.longdo.com/camera?vdo=i294" "https://traffic.longdo.com/camera?vdo=i294&showfilter=false&autoplay=true" "$bma" "$doh" "$img"; do
            echo "===== $u"
            curl -sS -L -m 20 -A "$UA" -D - -o body.out "$u" | grep -iE '^(HTTP/|content-type|x-frame-options|content-security-policy|access-control|cross-origin|location)' || true
            echo "size=$(wc -c < body.out)"; head -c 300 body.out | tr -d '\0' | head -c 300; echo
          done
          echo "-- how many BKK-area cameras have https hls / https link / https img:"
          jq -r '[.item[] | select((.geocode|tostring|.[0:2]) as $p | ["10","11","12","13","73","74"] | index($p))] | {n: length, hls_https: ([.[] | select((.hls_url // "") | startswith("https"))] | length), link_https: ([.[] | select((.link // "") | startswith("https"))] | length), img_https: ([.[] | select((.imgurl // "") | startswith("https"))] | length)}' cam.json
