name: Probe CCTV sources

# ดูข้อมูลสถานีของกรมทรัพยากรน้ำ (พิกัด/ระดับน้ำ) (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      T: https://telemetry.dwr.go.th
    steps:
      - name: getByCode
        run: |
          curl -sS -m 20 -A "$UA" -D h.txt -o s.json "$T/api/public/station/getByCode/TA100220"
          tr -d '\r' < h.txt | grep -iE '^(access-control|cache-control)'
          python3 - <<'PY'
          import json
          d = json.load(open('s.json'))['value']
          def walk(o, p=''):
              if isinstance(o, dict):
                  for k, v in o.items(): walk(v, f'{p}.{k}')
              elif isinstance(o, list):
                  print(f'{p}[] len={len(o)}')
                  if o: walk(o[0], p + '[0]')
              else:
                  print(f'{p} = {str(o)[:100]}')
          walk(d)
          PY
