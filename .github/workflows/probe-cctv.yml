name: Probe CCTV sources

# หากล้องอยุธยา: ระบบเมขลา กรมทรัพยากรน้ำ / StreamBridge (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Mekhala
        continue-on-error: true
        run: |
          for u in https://mekhala.dwr.go.th/ https://oldmekhala.dwr.go.th/ https://oldmekhala.dwr.go.th/en/index.php https://mekhala.dwr.go.th/cctv https://oldmekhala.dwr.go.th/cctv.php https://www.dwr.go.th/ ; do
            curl -sS -m 20 -A "$UA" -L -o r.bin -w "%{http_code} %{content_type} %{size_download} <- %{url_effective}\n" "$u" || true
            [ -s r.bin ] && grep -oiE '(href|src)="[^"]*(cctv|camera|cam|snap|jpg|m3u8)[^"]*"' r.bin | sort -u | head -15
            [ -s r.bin ] && grep -oiE '.{0,80}(อยุธยา|cctv|กล้อง)[^<"]{0,80}' r.bin | sort -u | head -8
          done
      - name: StreamBridge Ayutthaya guesses
        continue-on-error: true
        run: |
          for s in ayutthaya ayutthaya-city ayutthaya-pao ayutthaya-province phranakhonsiayutthaya ayothaya ayothaya-city bangpain bang-pa-in bangban senna sena uthai lopburi pathumthani bangsai wangnoi pakkret-city nakhonluang; do
            code=$(curl -sS -m 10 -A "$UA" -o /dev/null -w "%{http_code}" "https://app.streambridge.online/api/public/$s"); [ "$code" != "404" ] && echo "  $s -> $code"
          done; echo "(done)"
