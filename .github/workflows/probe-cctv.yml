name: Probe CCTV sources

# ใช้สำรวจแหล่งข้อมูลระหว่างพัฒนาเท่านั้น — รันเองจากแท็บ Actions (ไม่รันอัตโนมัติเมื่อ push)
# รอบ 3: ดูรูปแบบข้อมูลฝนของ POPNIX Flood (api_rain) เทียบกับสถานีฝน ThaiWater
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Rain
        run: |
          curl -sS -m 30 -A "$UA" -D h.txt -o r.json https://flood.pop.in.th/api_rain.php
          tr -d '\r' < h.txt | grep -iE '^(HTTP|cache-control|access-control)'
          curl -sS -m 60 -A "$UA" -H 'Origin: https://dataanalytic.precare.workers.dev' -o tw.json https://api-v3.thaiwater.net/api/v1/thaiwater30/public/rain_24h
          python3 - <<'PY'
          import json, math, collections
          d = json.load(open('r.json'))
          print('keys', list(d.keys())); print('summary', json.dumps(d.get('summary'), ensure_ascii=False)[:400])
          st = d.get('stations') or []
          print('stations', len(st)); print('keys', list(st[0].keys()))
          for x in st[:2]: print(json.dumps(x, ensure_ascii=False)[:400])
          print('agency', collections.Counter(x.get('agency') for x in st))
          print('bma codes', sum(1 for x in st if str(x.get('code', '')).startswith('bma:')))
          tw = json.load(open('tw.json')); tw = tw.get('data', tw) if isinstance(tw, dict) else tw
          tw = tw.get('data', tw) if isinstance(tw, dict) else tw
          pts = []
          for r in tw:
              s = r.get('station') or {}
              try: pts.append((float(s.get('tele_station_lat')), float(s.get('tele_station_long')), (r.get('geocode') or {}).get('province_code')))
              except Exception: pass
          print('thaiwater rain', len(pts), 'bkk', sum(1 for p in pts if p[2] == '10'))
          near = 0
          for x in st:
              if not str(x.get('code', '')).startswith('bma:') or x.get('lat') is None: continue
              m = min(math.hypot((x['lat'] - a) * 111, (x['lng'] - b) * 108) for a, b, _ in pts)
              near += m < 0.2
          print('bma within 200 m of a ThaiWater rain station', near)
          PY
