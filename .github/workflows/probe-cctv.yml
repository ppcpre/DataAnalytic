name: Probe CCTV sources

# ตรวจขั้นตอนเปิดภาพกล้อง bmatraffic.com (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      B: http://www.bmatraffic.com
    steps:
      - name: PlayVideo flow
        continue-on-error: true
        run: |
          pip install -q pillow >/dev/null 2>&1 || true
          curl -sS -m 20 -A "$UA" -c jar.txt -D h.txt -o pv.html "$B/PlayVideo.aspx?ID=1692" || echo "PlayVideo failed"
          tr -d '\r' < h.txt | grep -iE '^(HTTP|set-cookie)'
          python3 -c "
          h=open('pv.html',encoding='utf-8',errors='replace').read(); i=h.find('<script'); print(h[i:i+3500])"
          desc() { python3 - "$1" <<'PY'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('RGB'); px = list(im.getdata())
          from collections import Counter
          c = Counter(px).most_common(4); print(im.size, 'distinct colours', len(set(px)), 'top', c)
          PY
          }
          sleep 12
          curl -sS -m 20 -A "$UA" -b jar.txt -o a.bin -w "show+cookie %{http_code} %{content_type} %{size_download}\n" "$B/show.aspx?image=1692" || echo "show+cookie failed"
          [ -s a.bin ] && { file a.bin; desc a.bin; }
          sleep 12
          curl -sS -m 20 -A "$UA" -o b.bin -w "show-no-cookie %{http_code} %{content_type} %{size_download}\n" "$B/show.aspx?image=1692" || echo "show-no-cookie failed"
          [ -s b.bin ] && { file b.bin; desc b.bin; }
