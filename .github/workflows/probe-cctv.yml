name: Probe CCTV sources

# สำรวจระบบกล้อง bmatraffic.com (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      B: http://www.bmatraffic.com
    steps:
      - name: Home page structure
        continue-on-error: true
        run: |
          curl -sS -m 30 -A "$UA" -c jar.txt -D h.txt -o p.html "$B/"
          cat h.txt | tr -d '\r' | grep -iE '^(HTTP|set-cookie|content-type|server|location)'
          python3 - <<'PY'
          import re, collections
          h = open('p.html', encoding='utf-8', errors='replace').read()
          print('len', len(h))
          print('scripts', re.findall(r'<script[^>]+src="([^"]+)"', h)[:20])
          print('hrefs', collections.Counter(re.sub(r'\d+', 'N', x) for x in re.findall(r'(?:href|src)="([^"]+\.aspx[^"]*)"', h)).most_common(20))
          for k in ['ราชพฤกษ์', 'ปิ่นเกล้า', 'บรมราชชนนี', 'ตลิ่งชัน', 'สิรินธร', 'จรัญ', 'lat', 'lng', 'LatLng', 'PlayVideo', 'show.aspx', 'camera', 'm3u8', 'rtsp', 'json']:
              idx = [m.start() for m in re.finditer(k, h)]
              print('==', k, len(idx))
              for i in idx[:2]: print('   ', h[max(0, i-250):i+250].replace('\n', ' '))
          PY
      - name: Endpoints
        continue-on-error: true
        run: |
          for p in "index.aspx" "PlayVideo.aspx?ID=1" "show.aspx?image=1" "show.aspx?image=100" "DataService.asmx" "api/cameras" "cameras.json" "map.aspx"; do
            curl -sS -m 20 -A "$UA" -b jar.txt -c jar.txt -e "$B/" -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $p\n" "$B/$p" || true
            file r.bin | cut -c1-120; head -c 250 r.bin | tr '\n\r' '  '; echo
          done
