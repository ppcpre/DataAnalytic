name: Probe CCTV sources

# ตรวจว่าเว็บดูกล้องในกรุงเทพฯ และปริมณฑลยังเปิดได้ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Reachability
        continue-on-error: true
        run: |
          for u in \
            https://traffic.longdo.com/camera https://cpudapp.bangkok.go.th/bmatraffic http://www.bmatraffic.com/ https://weather.bangkok.go.th/flood https://dds.bangkok.go.th/ \
            https://www.thaiclouderp.com/CCTV_MONITOR/web/pakkred https://www.pakkretconnect.com/ https://www.pakkretconnect.com/liffwater/eon http://182.52.224.70/?page=cctv \
            https://telemetry.dwr.go.th/reportCctv https://cdp.rangsitcity.go.th/ https://app.streambridge.online/p/bangkruai-city https://hdms.doh.go.th/dashboard \
            https://www.thaiwater.net/new4all https://www.exat.co.th/ https://www.iticfoundation.org/ https://flood.gistda.or.th/ ; do
            r=$(curl -sS -m 20 -A "$UA" -L -o p.bin -w "%{http_code} %{size_download} %{url_effective}" "$u" 2>&1 | tail -1)
            t=$(grep -oiE '<title>[^<]{0,100}' p.bin 2>/dev/null | head -1 | sed 's/<title>//I')
            c=$(grep -ciE 'cctv|กล้อง|camera' p.bin 2>/dev/null)
            echo "$r | title=$t | cctv-mentions=$c"
          done
      - name: Pakkret CCTV links
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -L -o pk.html https://www.pakkretconnect.com/
          grep -oiE 'href="[^"]*"' pk.html | grep -iE 'cctv|camera|กล้อง|water|flood|liff' | sort -u | head -20
          grep -oiE '.{0,80}(cctv|กล้อง)[^<]{0,80}' pk.html | sort -u | head -10
          curl -sS -m 20 -A "$UA" -L -o ex.html https://www.exat.co.th/
          grep -oiE 'href="[^"]*"' ex.html | grep -iE 'cctv|camera|traffic|จราจร' | sort -u | head -10
