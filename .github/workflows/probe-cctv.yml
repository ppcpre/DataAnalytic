name: Probe CCTV sources

# นับกล้องบนเว็บจริงแยกตามจังหวัด (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Count
        run: |
          for i in $(seq 1 30); do
            curl -sS -m 90 -o c.json "$APP/api/cameras?ts=$(date +%s)" || true
            n=$(python3 -c "import json; d=json.load(open('c.json'))['data']; print(sum(c['location']['province'] in ('15','16','17','18','19','60','72') for c in d))" 2>/dev/null || echo 0)
            echo "try $i: upstream=$n"; [ "$n" -gt 0 ] && break; sleep 20
          done
          python3 - <<'PY'
          import json, collections
          d = json.load(open('c.json'))['data']
          print('total', len(d))
          print(collections.Counter(c['location'].get('provinceName') or c['location']['province'] for c in d).most_common())
          for c in d:
              if c['location']['province'] in ('15','16','17','18','19','60','72'):
                  r = (c.get('readings') or [{}])[0]
                  print(' ', c['id'], c['name'], '|', c['location'].get('provinceName'), '|', c.get('road'), '|', r.get('value'), r.get('warning'), r.get('danger'))
          PY
          curl -sS -m 30 "$APP/api/links" | python3 -c "import json,sys; d=json.load(sys.stdin); print('links', [x['id'] for x in d['cameras']])"
