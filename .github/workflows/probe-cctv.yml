name: Probe CCTV sources

# สำรวจสถานีวัดน้ำใกล้กล้อง/จุดวัดระดับน้ำ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: ThaiWater stations near water cameras
        run: |
          curl -sS -m 60 -H 'Origin: https://dataanalytic.precare.workers.dev' "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load" -o w.json
          python3 - <<'PY'
          import json, math
          d = json.load(open('w.json'))
          rows = d.get('waterlevel_data', {}).get('data') or d.get('data') or []
          print('rows', len(rows))
          pts = {'mahasawat': (13.79965, 100.43863), 'nont-pier': (13.8617, 100.4959), 'pakkret': (13.9153, 100.4947)}
          def km(a, b):
              return math.hypot((a[0]-b[0])*111, (a[1]-b[1])*108)
          for name, p in pts.items():
              near = []
              for r in rows:
                  st = r.get('station', {})
                  try: q = (float(st['tele_station_lat']), float(st['tele_station_long']))
                  except Exception: continue
                  k = km(p, q)
                  if k < 4: near.append((k, st.get('id'), (st.get('tele_station_name') or {}).get('th'), (r.get('agency') or {}).get('agency_shortname', {}), r.get('waterlevel_msl'), st.get('min_bank') or r.get('min_bank'), r.get('waterlevel_datetime')))
              print('==', name)
              for n in sorted(near)[:6]: print(' ', round(n[0], 2), n[1:])
          PY
