name: Probe CCTV sources

# ตรวจจุดวัดคลอง กทม. (POPNIX Flood) บนเว็บจริง (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP: https://dataanalytic.precare.workers.dev
    steps:
      - name: Live API
        run: |
          for i in $(seq 1 30); do
            curl -sS -m 90 -o c.json "$APP/api/cameras?ts=$(date +%s)" || true
            n=$(python3 -c "import json; d=json.load(open('c.json'))['data']; print(sum(c['id'].startswith('pop-') for c in d))" 2>/dev/null || echo 0)
            echo "try $i: popnix=$n"; [ "$n" -gt 0 ] && break; sleep 20
          done
          python3 - <<'PY'
          import json, collections
          d = json.load(open('c.json'))['data']
          p = [c for c in d if c['id'].startswith('pop-')]
          print('total', len(d), 'popnix', len(p), 'canals', sum(c['id'].startswith('pop-c') for c in p), 'roads', sum(c['id'].startswith('pop-r') for c in p))
          def lv(c):
              r = c['readings'][0]
              return 'critical' if r.get('danger') is not None and r['value'] >= r['danger'] else 'watch' if r.get('warning') is not None and r['value'] >= r['warning'] else 'normal'
          print('levels', collections.Counter(lv(c) for c in p))
          for c in [c for c in p if lv(c) == 'critical'][:8]: print('  crit', c['id'], c['name'], c['readings'][0])
          PY
      - name: Chrome sheet
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          id=$(python3 -c "import json; d=json.load(open('../c.json'))['data']; print(next(c['id'] for c in d if c['id'].startswith('pop-c')))")
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage({ viewport: { width: 390, height: 844 } });
          await p.goto(`${process.env.APP}/?cam=${process.env.ID}`, { waitUntil: 'domcontentloaded' });
          await p.waitForSelector('#sheet [data-chart-hours="168"]', { timeout: 60000 });
          await p.waitForTimeout(6000);
          const info = () => p.evaluate(() => { const s = document.getElementById('sheet'); const svg = s.querySelector('.chart-host svg'); return { title: s.querySelector('.sheet-title')?.textContent, tiles: [...s.querySelectorAll('.tile')].map((e) => e.textContent.replace(/\s+/g, ' ')), chart: svg ? svg.getAttribute('aria-label') : s.querySelector('.chart-host')?.textContent?.trim(), captions: [...s.querySelectorAll('.btn-caption')].map((e) => e.textContent) }; });
          console.log('SHEET 24h', JSON.stringify(await info()));
          await p.click('#sheet [data-chart-hours="168"]');
          await p.waitForTimeout(6000);
          console.log('SHEET 7d', JSON.stringify((await info()).chart));
          await b.close();
          JS
          ID=$id node t.mjs
