name: Probe CCTV sources

# สำรวจหน้าสถานีของสำนักการระบายน้ำ กทม. (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: BMA drainage station pages
        run: |
          for u in "https://weather.bangkok.go.th/water/StationDetail?id=73" "https://weather.bangkok.go.th/water" "https://weather.bangkok.go.th/" "http://weather.bangkok.go.th/water/StationDetail?id=73"; do
            for opt in "" "--http1.1" "--tlsv1.2 --tls-max 1.2"; do
              echo "===== $u [$opt]"
              curl -sS -L -m 20 $opt -A "$UA" -H "Accept-Language: th-TH,th;q=0.9" -o p.html -w "HTTP %{http_code} ip=%{remote_ip} size=%{size_download}\n" "$u" 2>&1 | tail -2 || true
              if [ -s p.html ]; then grep -oiE '<title>[^<]*</title>' p.html | head -1; grep -oiE '(src|href|url)\s*[=:]\s*["'"'"'][^"'"'"']*(api|json|image|img|jpg|png|cctv|station|ashx)[^"'"'"']*["'"'"']' p.html | sort -u | head -40; break; fi
            done
          done
          echo "-- DNS"; getent hosts weather.bangkok.go.th || true
