name: Probe CCTV sources

# สำรวจระบบ Flood Watch ของเทศบาลนครรังสิต (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      B: https://cdp.rangsitcity.go.th
    steps:
      - name: Records in page data
        continue-on-error: true
        run: |
          curl -sS -m 30 -A "$UA" -o p.html "$B/"
          python3 - <<'PY'
          import re, json
          h = open('p.html', encoding='utf-8', errors='replace').read()
          # รวม self.__next_f.push([1,"..."]) เป็นข้อความเดียว
          parts = re.findall(r'self\.__next_f\.push\(\[1,"((?:[^"\\]|\\.)*)"\]\)', h)
          s = ''.join(json.loads('"%s"' % p) for p in parts)
          open('rsc.txt', 'w').write(s)
          print('rsc len', len(s))
          for key in ['"waterLevel"', '"latitude"', 'snapshot', '"cameras"', '"cctv"', 'streamUrl', 'hls', 'm3u8', 'rtsp']:
              idx = [m.start() for m in re.finditer(re.escape(key), s)]
              print('==', key, len(idx))
              for i in idx[:2]:
                  print(s[max(0, i-500):i+700].replace('\n', ' '))
                  print('--')
          # วัตถุที่มี latitude แต่ไม่มี waterLevel
          objs = re.findall(r'\{[^{}]*"latitude"[^{}]*\}', s)
          print('objs with latitude', len(objs))
          nw = [o for o in objs if 'waterLevel' not in o]
          print('without waterLevel', len(nw))
          for o in nw[:8]: print(o[:800])
          PY
      - name: Snapshot endpoint and JS
        continue-on-error: true
        run: |
          for s in $(grep -oE '/_next/static/chunks/[^"]+\.js' p.html | sort -u); do
            curl -sS -m 20 -o c.js "$B$s" || continue
            if grep -q 'flood/snapshot' c.js; then
              echo "== $s"
              grep -oE '.{0,1500}/api/flood/snapshot.{0,1500}' c.js | head -c 4000; echo
              grep -oE '.{0,300}(cameras|cctv|Cctv|Camera)[^a-z].{0,300}' c.js | head -c 3000; echo
            fi
          done
          for p in api/flood/cameras api/flood/cctv api/cctv/list api/flood/snapshot api/flood/reports api/flood/reports?limit=5 api/flood/markers api/flood/map; do
            curl -sS -m 15 -A "$UA" -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $p\n" "$B/$p"; head -c 400 r.bin | tr '\n' ' '; echo
          done
