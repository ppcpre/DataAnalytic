name: Probe CCTV sources

# สำรวจระบบกล้อง bmatraffic.com (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      B: http://www.bmatraffic.com
    steps:
      - name: How cameras open
        continue-on-error: true
        run: |
          curl -sS -m 30 -A "$UA" -o p.html "$B/"
          python3 - <<'PY'
          import re
          h = open('p.html', encoding='utf-8', errors='replace').read()
          for k in [r"\.aspx\?[A-Za-z]+=", 'image=', 'window.open', 'location.href', r"\$\('\.subname'\)", 'subname', 'PlayVideo', 'snapshot', 'jpg?']:
              idx = [m.start() for m in re.finditer(k, h)]
              print('==', k, len(idx))
              for i in idx[:3]: print('   ', h[max(0, i-300):i+300].replace('\n', ' '))
          print(sorted(set(re.findall(r'[\w/-]+\.aspx', h))))
          PY
      - name: Spaced requests
        continue-on-error: true
        run: |
          for t in 0 30 60; do
            sleep $t
            curl -sS -m 20 -A "$UA" -o /dev/null -w "after +${t}s home %{http_code} %{size_download}\n" "$B/" || echo "after +${t}s home failed"
          done
          sleep 30
          curl -sS -m 20 -A "$UA" -o r.bin -w "show no-cookie %{http_code} %{content_type} %{size_download}\n" "$B/show.aspx?image=1692" || echo "show failed"
          file r.bin 2>/dev/null
          sleep 30
          curl -sS -m 20 -A "$UA" -o r.bin -w "images dir %{http_code} %{content_type}\n" "$B/images/logo-bkk-small.png" || echo "static failed"
