name: Probe CCTV sources

# ดูแหล่งรายชื่อกล้องของ Longdo/iTIC (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Fetch calls in Longdo script
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -o s.js "https://traffic.longdo.com/sites/all/modules/traffic_camera/script.js?v=92"
          grep -nE 'fetch\(|XMLHttpRequest|\$\.get|\.json|https?://' s.js | cut -c1-220 | head -40
      - name: iTIC sites
        continue-on-error: true
        run: |
          for u in https://iticfoundation.org/ https://www.iticfoundation.org/cctv https://camera.iticfoundation.org/ https://cctv.iticfoundation.org/ https://its.iticfoundation.org/ https://www.its.in.th/ ; do
            curl -sS -m 15 -A "$UA" -L -o r.bin -w "%{http_code} %{content_type} %{size_download} <- $u\n" "$u" || true
            [ -s r.bin ] && grep -oiE '.{0,80}(cctv|camera|กล้อง|m3u8)[^<"]{0,80}' r.bin | sort -u | head -6
          done
