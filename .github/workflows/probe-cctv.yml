name: Probe CCTV sources

# ใช้สำรวจแหล่งข้อมูลระหว่างพัฒนาเท่านั้น — รันเองจากแท็บ Actions (ไม่รันอัตโนมัติเมื่อ push)
# ทดสอบ relay ทั้งระบบ: build Docker image → รัน relay → รัน API ด้วย RELAY_URL → ตรวจ /api/bma/status
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the relay image
        run: |
          docker build -f apps/api/Dockerfile.relay -t flood-watch-relay .
          KEY=$(openssl rand -base64 32); echo "::add-mask::$KEY"; echo "KEY=$KEY" >> $GITHUB_ENV
          docker run -d --name relay -p 127.0.0.1:8788:8788 -e RELAY_KEY="$KEY" flood-watch-relay
          sleep 3; curl -sS http://127.0.0.1:8788/health; echo
          curl -sS -o /dev/null -w "no key -> %{http_code}\n" "http://127.0.0.1:8788/bmatraffic?path=/"
          curl -sS -H "x-relay-key: $KEY" -o page.html -w "page via relay -> %{http_code} %{size_download}\n" "http://127.0.0.1:8788/bmatraffic?path=/"
          docker image ls flood-watch-relay --format '{{.Size}}'
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API through the relay
        run: |
          npm ci >/dev/null 2>&1
          npm run build --workspace @flood-watch/api >/dev/null
          RELAY_URL=http://127.0.0.1:8788 RELAY_KEY="$KEY" PORT=8787 node apps/api/dist/server.js > api.log 2>&1 &
          sleep 4
          curl -sS -m 120 http://127.0.0.1:8787/api/bma/status; echo
          curl -sS -m 60 -o /dev/null -w "bma image proxy -> %{http_code}\n" "http://127.0.0.1:8787/api/bma/image?id=1692"
          tail -5 api.log; docker logs relay 2>&1 | tail -5
