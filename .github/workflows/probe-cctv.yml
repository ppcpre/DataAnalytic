name: Probe CCTV sources

# สำรวจ API กล้องของกรมทรัพยากรน้ำ (telemetry.dwr.go.th) (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      T: https://telemetry.dwr.go.th
    steps:
      - name: API client chunk
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -o c.js "$T/_next/static/chunks/6964-1ce0128e2f013e4c.js"
          python3 - <<'PY'
          import re
          s = open('c.js', encoding='utf-8', errors='replace').read()
          print('len', len(s))
          for k in ['streamUrl', 'imageCctv', 'https://', 'NEXT_PUBLIC', '"/station', '/cctv', 'stationList', 'getStation', 'mapStation', 'lat']:
              idx = [m.start() for m in re.finditer(re.escape(k), s)]
              print('==', k, len(idx))
              for i in idx[:4]: print('   ', s[max(0, i-250):i+300].replace('\n', ' '))
          print('ENDPOINTS', sorted(set(re.findall(r'concat\([a-z],"(/[A-Za-z0-9/_-]+)"', s)))[:200])
          PY
      - name: Report page chunk
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -o r.js "$T/_next/static/chunks/pages/reportCctv-2314420cf5a39383.js"
          grep -oE '.{0,200}(cctv|Cctv)[^;]{0,200}' r.js | head -12
