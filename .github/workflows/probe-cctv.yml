name: Probe CCTV sources

# หา API รายชื่อสถานีกล้องของกรมทรัพยากรน้ำ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
  push:
    branches: [claude/progressive-web-flood-data-m8f1ov]
    paths: [.github/workflows/probe-cctv.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      T: https://telemetry.dwr.go.th
    steps:
      - name: CRUD helper
        continue-on-error: true
        run: |
          curl -sS -m 20 -A "$UA" -o r.js "$T/_next/static/chunks/pages/reportCctv-2314420cf5a39383.js"
          python3 - <<'PY'
          s = open('r.js', encoding='utf-8', errors='replace').read()
          i = s.find('6551:(e,t,r)=>')
          print(s[i:i+1500])
          j = s.find('z=async e=>{try{var t')
          print('---- z'); print(s[j:j+1200])
          PY
      - name: Try list endpoints
        continue-on-error: true
        run: |
          for p in "api/public/reportCctv/search?page=0&size=5" "api/public/reportCctv/query" "api/public/reportCctv/filter" "api/public/reportCctv/datatable" "api/public/reportCctv/all" "api/public/reportCctv/getAll" "api/public/reportCctv/table"; do
            curl -sS -m 20 -A "$UA" -X POST -H 'content-type: application/json' -d '{}' -o r.bin -w "POST %{http_code} %{size_download} <- $p\n" "$T/$p"; head -c 300 r.bin | tr '\n' ' '; echo
          done
