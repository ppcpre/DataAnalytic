name: Probe CCTV sources

# สำรวจแหล่งรายชื่อกล้อง CCTV ที่มีพิกัด/ลิงก์รายตัว (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
    steps:
      - name: Open data portals (CKAN)
        run: |
          for base in https://data.bangkok.go.th https://data.go.th https://gdcatalog.go.th; do
            for q in cctv "กล้อง" "กล้องวงจรปิด"; do
              echo "===== $base q=$q"
              curl -sS -m 30 -A "$UA" -G "$base/api/3/action/package_search" --data-urlencode "q=$q" --data-urlencode "rows=15" -o ck.json -w "HTTP %{http_code}\n" || continue
              jq -c '.result.results[]? | {name, title, org: .organization.title, res: [.resources[]? | {format, url}][:4]}' ck.json 2>/dev/null | head -15 || head -c 400 ck.json
            done
          done

      - name: Longdo camera page
        run: |
          curl -sS -L -m 30 -A "$UA" -o cam.html -w "HTTP %{http_code} size=%{size_download}\n" https://traffic.longdo.com/camera || true
          echo "-- scripts:"; grep -oiE 'src="[^"]+"' cam.html | sort -u | head -30
          echo "-- hints:"; grep -oiE '[a-zA-Z0-9_/.:?=&-]*(camera|cctv|cam_|camid|json|feed|api)[a-zA-Z0-9_/.?=&:-]*' cam.html | sort -u | head -60
          echo "-- inline sample:"; grep -oiE '(lat|lon|latitude|longitude)["'"'"']?\s*[:=]\s*[0-9.]+' cam.html | head -10
          for s in $(grep -oiE 'src="[^"]+\.js[^"]*"' cam.html | sed -E 's/src="([^"]+)"/\1/' | grep -vi 'google\|jquery' | head -12); do
            case "$s" in http*) url="$s";; //*) url="https:$s";; /*) url="https://traffic.longdo.com$s";; *) url="https://traffic.longdo.com/$s";; esac
            echo "===== $url"
            curl -sS -L -m 30 -A "$UA" -o s.js "$url" || continue
            grep -oiE '["'"'"'`][^"'"'"'`]*(camera|cctv|/api/|\.json|feed)[^"'"'"'`]*["'"'"'`]' s.js | sort -u | head -25
          done

      - name: DOH HDMS
        run: |
          for u in https://hdms.doh.go.th/dashboard https://hdms.doh.go.th/ https://cctv.doh.go.th/; do
            echo "===== $u"
            curl -sS -L -m 30 -A "$UA" -o d.html -w "HTTP %{http_code} final=%{url_effective} size=%{size_download}\n" "$u" || continue
            grep -oiE '[a-zA-Z0-9_/.:?=&-]*(camera|cctv|api|json)[a-zA-Z0-9_/.?=&:-]*' d.html | sort -u | head -30
          done
