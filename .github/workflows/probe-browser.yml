name: Browser test (live site)

# เปิดเว็บจริงใน Chrome แล้วลองเปิดภาพกล้องหลายแบบ ว่าภาพขึ้นหรือไม่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL ของเว็บที่ deploy
        default: https://dataanalytic.precare.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      BASE: ${{ inputs.url }}
    steps:
      - name: Real browser test
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          p.on('response', r => { if (/thaiwater|\/api\//.test(r.url()) && !/\.ts(\?|$)/.test(r.url())) console.log('RESP', r.status(), r.headers()['content-type'], r.headers()['access-control-allow-origin'] ?? '-', r.url().slice(0, 110)); });
          p.on('requestfailed', r => { if (/itic/.test(r.url())) console.log('FAIL', r.failure()?.errorText, r.url().slice(0, 100)); });
          p.on('console', m => { if (m.type() !== 'log') console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
          await p.goto(process.env.BASE + '/', { waitUntil: 'domcontentloaded' });
          await p.waitForSelector('.pin-camera', { timeout: 30000 });
          const n = await p.locator('.pin-camera').count();
          console.log('camera pins', n, 'live pins', await p.locator('.pin-live').count());
          await p.waitForTimeout(20000);
          console.log('DATA', JSON.stringify(await p.evaluate(() => ({ watercams: [...document.querySelectorAll('.pin-watercam')].length, alertPins: document.querySelectorAll('[class*=pin-alert-]').length, radar: [...document.querySelectorAll('.radar-card')].map((e) => e.textContent.replace(/\s+/g, ' ').trim()), radarImgs: [...document.querySelectorAll('.radar-card img')].map((i) => i.naturalWidth), waterList: [...document.querySelectorAll('#water-cams .link-name')].map((e) => e.textContent), water: document.querySelectorAll('.pin-water').length, rain: document.querySelectorAll('.pin-rain').length, cams: document.querySelectorAll('.pin-camera').length, banners: [...document.querySelectorAll('#banners *')].map((e) => e.textContent.trim()).filter(Boolean), keys: document.getElementById('key-list')?.textContent?.replace(/\s+/g, ' ').slice(0, 200) }))));
          // เปิดหน้าต่างของจุดวัดระดับน้ำ: ภาพเทียบตลิ่ง / ภาพกล้องนนทบุรี / ค่าวัด
          const m = await b.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2 });
          await m.goto(process.env.BASE + '/', { waitUntil: 'domcontentloaded' });
          await m.waitForSelector('[data-open="camera:water-bma-mahasawat"]', { state: 'attached', timeout: 40000 });
          await m.waitForTimeout(15000);
          for (const id of ['water-bma-mahasawat', 'nont-STN2', 'sb-4aac4b3e-b18a-49a3-903b-e3ad9f960a44']) {
            // กล้องที่ไม่อยู่ในรายการจุดวัดน้ำ: เพิ่มปุ่มชั่วคราวในรายการเพื่อเปิดหน้าต่างกล้อง
            await m.evaluate((id) => {
              let b = document.querySelector(`[data-open="camera:${id}"]`);
              if (!b) { b = document.createElement('button'); b.dataset.open = `camera:${id}`; document.querySelector('#water-cams ul').appendChild(b); }
              b.click();
            }, id);
            if (id.startsWith('sb-')) await m.waitForTimeout(10000);
            await m.waitForTimeout(8000);
            console.log('SHEET', id, JSON.stringify(await m.evaluate(() => {
              const s = document.getElementById('sheet');
              const img = s.querySelector('.cam-media img');
              const fr = s.querySelector('.cam-media iframe');
              return { title: s.querySelector('h2,h3')?.textContent, diagram: !!s.querySelector('svg[viewBox]'), nearTitle: [...s.querySelectorAll('.nearby-title')].map((e) => e.textContent), tiles: [...s.querySelectorAll('.tile')].map((e) => e.textContent.replace(/\s+/g, ' ')), img: img ? img.naturalWidth : null, video: (() => { const v = s.querySelector('.cam-media video'); return v ? { w: v.videoWidth, t: Math.round(v.currentTime * 10) / 10, src: (v.currentSrc || '').slice(0, 60) } : null; })(), label: s.querySelector('[data-cam-label]')?.textContent, frameTop: fr?.style.top ?? null, mode: s.querySelector('.cam-view')?.dataset.mode };
            })));
            await m.screenshot({ path: `sheet-${id}.png` });
            await m.evaluate(() => document.querySelector('#sheet [aria-label="ปิด"], #sheet .sheet-close')?.click());
            await m.waitForTimeout(1000);
          }
          // กล้องโปรด: กดดาวในหน้าต่างกล้อง → โหลดหน้าใหม่ → ต้องยังอยู่ในแท็บรายการโปรด
          await m.evaluate(() => {
            let b = document.querySelector('[data-open="camera:sb-4aac4b3e-b18a-49a3-903b-e3ad9f960a44"]');
            if (!b) { b = document.createElement('button'); b.dataset.open = 'camera:sb-4aac4b3e-b18a-49a3-903b-e3ad9f960a44'; document.querySelector('#water-cams ul').appendChild(b); }
            b.click();
          });
          await m.waitForTimeout(1500);
          await m.click('#sheet [data-fav-toggle]');
          console.log('FAV pressed', await m.getAttribute('#sheet [data-fav-toggle]', 'aria-pressed'));
          await m.reload({ waitUntil: 'domcontentloaded' });
          await m.waitForTimeout(15000);
          await m.click('.tabbar [data-view="fav"]');
          await m.waitForTimeout(1000);
          console.log('FAV list', JSON.stringify(await m.evaluate(() => ({ badge: document.getElementById('fav-badge')?.textContent, items: [...document.querySelectorAll('#fav-list .link-name')].map((e) => e.textContent), visible: getComputedStyle(document.getElementById('sec-fav')).display }))));
          await m.screenshot({ path: 'fav.png' });
          await m.click('#fav-list [data-open]');
          await m.waitForTimeout(3000);
          console.log('FAV open', await m.evaluate(() => document.querySelector('#sheet .sheet-title')?.textContent));
          // ลิงก์แชร์: เปิด /?cam=<id> แล้วต้องเปิดหน้าต่างกล้องนั้นเอง และปุ่มแชร์คัดลอกลิงก์ได้
          const ctx2 = await b.newContext({ viewport: { width: 390, height: 844 }, permissions: ['clipboard-read', 'clipboard-write'] });
          const sp = await ctx2.newPage();
          await sp.goto(process.env.BASE + '/?cam=sb-4aac4b3e-b18a-49a3-903b-e3ad9f960a44', { waitUntil: 'domcontentloaded' });
          await sp.waitForSelector('#sheet [data-share]', { timeout: 60000 });
          console.log('SHARE opened', await sp.evaluate(() => ({ title: document.querySelector('#sheet .sheet-title')?.textContent, url: location.href })));
          await sp.click('#sheet [data-share]');
          await sp.waitForTimeout(800);
          console.log('SHARE copied', await sp.evaluate(async () => ({ clip: await navigator.clipboard.readText().catch((e) => 'ERR ' + e.message), toast: document.getElementById('toast')?.textContent })));
          await sp.screenshot({ path: 'share.png' });
          await b.close();
          JS
          BASE="$BASE" node t.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: b/*.png
