name: Browser test (live site)

# เปิดเว็บจริงใน Chrome แล้วลองเปิดภาพกล้องหลายแบบ ว่าภาพขึ้นหรือไม่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL ของเว็บที่ deploy
        default: https://dataanalytic.precare.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      BASE: ${{ inputs.url }}
    steps:
      - name: Real browser test
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          p.on('response', r => { if (/thaiwater|\/api\//.test(r.url()) && !/\.ts(\?|$)/.test(r.url())) console.log('RESP', r.status(), r.headers()['content-type'], r.headers()['access-control-allow-origin'] ?? '-', r.url().slice(0, 110)); });
          p.on('requestfailed', r => { if (/itic/.test(r.url())) console.log('FAIL', r.failure()?.errorText, r.url().slice(0, 100)); });
          p.on('console', m => { if (m.type() !== 'log') console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
          await p.goto(process.env.BASE + '/', { waitUntil: 'domcontentloaded' });
          await p.waitForSelector('.pin-camera', { timeout: 30000 });
          const n = await p.locator('.pin-camera').count();
          console.log('camera pins', n, 'live pins', await p.locator('.pin-live').count());
          await p.waitForTimeout(20000);
          console.log('DATA', JSON.stringify(await p.evaluate(() => ({ water: document.querySelectorAll('.pin-water').length, rain: document.querySelectorAll('.pin-rain').length, cams: document.querySelectorAll('.pin-camera').length, banners: [...document.querySelectorAll('#banners *')].map((e) => e.textContent.trim()).filter(Boolean), keys: document.getElementById('key-list')?.textContent?.replace(/\s+/g, ' ').slice(0, 200) }))));
          await b.close();
          JS
          BASE="$BASE" node t.mjs
