name: Browser camera test

# เปิดเว็บจริงใน Chrome แล้วลองเปิดภาพกล้องหลายแบบ ว่าภาพขึ้นหรือไม่ (รันเองจากแท็บ Actions)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL ของเว็บที่ deploy
        default: https://dataanalytic.precare.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'
      BASE: ${{ inputs.url }}
    steps:
      - name: Real browser test
        run: |
          mkdir b && cd b && npm init -y >/dev/null && npm i playwright-core@1 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const b = await chromium.launch({ executablePath: '/usr/bin/google-chrome' });
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          p.on('response', r => { if (/itic/.test(r.url()) && !/\.ts(\?|$)/.test(r.url())) console.log('RESP', r.status(), r.headers()['content-type'], r.headers()['access-control-allow-origin'] ?? '-', r.url().slice(0, 110)); });
          p.on('requestfailed', r => { if (/itic/.test(r.url())) console.log('FAIL', r.failure()?.errorText, r.url().slice(0, 100)); });
          p.on('console', m => { if (m.type() !== 'log') console.log('CONSOLE', m.type(), m.text().slice(0, 200)); });
          await p.goto(process.env.BASE + '/', { waitUntil: 'domcontentloaded' });
          await p.waitForSelector('.pin-camera', { timeout: 30000 });
          const n = await p.locator('.pin-camera').count();
          console.log('camera pins', n, 'live pins', await p.locator('.pin-live').count());
          const cams = (await (await fetch(process.env.BASE + '/api/cameras')).json()).data;
          const pick = [...cams.filter(c => /PER|DOH/.test(c.id)).slice(0, 4), ...cams.filter(c => /BMAMI/.test(c.id)).slice(0, 4)];
          console.log('picked', pick.map(c => c.id).join(' '));
          for (let i = 0; i < pick.length; i++) {
            await p.evaluate((name) => [...document.querySelectorAll('.leaflet-marker-icon')].find(m => m.getAttribute('title')?.startsWith(name))?.dispatchEvent(new MouseEvent('click', { bubbles: true })), pick[i].name);
            await p.waitForSelector('[data-cam-view]', { timeout: 5000 }).catch(() => {});
            await p.waitForTimeout(14000);
            const r = await p.evaluate(() => { const v = document.querySelector('[data-cam-view]'); const img = v?.querySelector('img'); const vid = v?.querySelector('video'); return v && { title: document.querySelector('.sheet-title')?.textContent, mode: v.dataset.mode, loaded: v.classList.contains('is-loaded'), imgW: img?.naturalWidth, vidW: vid?.videoWidth, vidTime: vid?.currentTime }; });
            console.log('CAM', i, JSON.stringify(r));
          }
          
          await b.close();
          JS
          BASE="$BASE" node t.mjs
