name: Smoke test (deployed site)

# ตรวจเว็บที่ deploy แล้วว่า API ตอบและดึงข้อมูลจริงได้ — กดรันเองจากแท็บ Actions
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL ของเว็บที่ deploy
        default: https://dataanalytic.precare.workers.dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.url }}
    steps:
      - name: Health
        run: |
          curl -sS -m 30 "$BASE/api/health"; echo

      - name: Water level
        run: |
          curl -sS -m 60 -o wl.json -w "HTTP %{http_code}\n" "$BASE/api/water-level"
          jq -c '{source, fetchedAt, sample, stale, error, count: (.data | length? // 0)}' wl.json || head -c 1000 wl.json
          jq -c '.data[:2]' wl.json 2>/dev/null || true

      - name: Rain
        run: |
          curl -sS -m 60 -o rain.json -w "HTTP %{http_code}\n" "$BASE/api/rain"
          jq -c '{source, sample, stale, error, count: (.data | length? // 0)}' rain.json || head -c 1000 rain.json
          jq -c '.data[:2]' rain.json 2>/dev/null || true

      - name: Key stations and cameras
        run: |
          curl -sS -m 60 "$BASE/api/key-stations" | jq -c '{error, count: (.data | length? // 0), data: [.data[]? | {code, name, percent, trend}]}'
          curl -sS -m 60 "$BASE/api/cameras" | jq -c '{error, source, count: (.data | length? // 0), byProvince: ([.data[]?.location.province] | group_by(.) | map({(.[0]): length}) | add), first: [.data[:3][]? | {name, owner, url}]}'

      - name: Place search
        run: |
          curl -sS -m 30 -G "$BASE/api/geocode" --data-urlencode "q=ลาดพร้าว" | jq -c '{error, count: (.data | length? // 0), first: .data[0]}'

      - name: Web app
        run: |
          curl -sS -m 30 -o index.html -w "HTTP %{http_code}\n" "$BASE/"
          grep -o '<title>[^<]*</title>' index.html
          curl -sS -m 30 -o /dev/null -w "manifest HTTP %{http_code}\n" "$BASE/manifest.webmanifest"
          curl -sS -m 30 -o /dev/null -w "sw.js HTTP %{http_code}\n" "$BASE/sw.js"

      # ดูโครงสร้างข้อมูลต้นทางโดยตรง เพื่อใช้ปรับตัวอ่านข้อมูล (adapter)
      - name: ThaiWater upstream shape
        run: |
          for ep in waterlevel_load rain_24h; do
            echo "== $ep"
            curl -sS -m 60 -o up.json -w "HTTP %{http_code}\n" "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/$ep"
            jq -c 'paths(type == "array") | map(tostring) | join(".")' up.json 2>/dev/null | head -5 || head -c 500 up.json
            jq -c '[.. | arrays | select(length > 0 and (.[0] | type) == "object")][0][0]' up.json 2>/dev/null | head -c 3000; echo
          done

      # ตรวจลิงก์ภายนอก (กล้อง CCTV และแหล่งข้อมูล) ว่าเปิดได้หรือไม่
      - name: External links
        run: |
          curl -sS -m 30 "$BASE/api/links" | jq -r '(.cameras + .official)[] | "\(.id) \(.url)"' | while read -r id url; do
            out=$(curl -sS -L -m 30 -A "Mozilla/5.0" -o /dev/null -w "%{http_code} final=%{url_effective}" "$url" 2>&1 || true)
            echo "$id | $url | $out"
          done

      - name: Key station codes upstream
        run: |
          curl -sS -m 60 -o up.json "https://api-v3.thaiwater.net/api/v1/thaiwater30/public/waterlevel_load"
          jq -c '.waterlevel_data.data[] | select((.station.tele_station_oldcode // "") | test("^C\\.?(2|13|29|29A|22A|35|7A)$"; "i")) | {code: .station.tele_station_oldcode, name: .station.tele_station_name.th, prov: .geocode.province_name.th, t: .waterlevel_datetime, pct: .storage_percent}' up.json
          echo "stations with name containing บางไทร:"
          jq -c '.waterlevel_data.data[] | select(.station.tele_station_name.th | test("บางไทร")) | {code: .station.tele_station_oldcode, name: .station.tele_station_name.th, t: .waterlevel_datetime}' up.json
